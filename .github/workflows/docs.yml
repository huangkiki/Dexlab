name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select frontend regression tests
        id: frontend
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --no-renames "$BASE" HEAD -- web .github/workflows/docs.yml | grep -q .; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r docs/site/requirements.txt
      - run: npm ci --prefix web
      - name: Frontend regression tests
        if: steps.frontend.outputs.test == 'true'
        run: npm test --prefix web
      - run: npm run build --prefix web
      - run: python scripts/build_docs.py
      - run: mkdir -p docs/_build/html/_static/live-lab && cp -R web/dist/. docs/_build/html/_static/live-lab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
