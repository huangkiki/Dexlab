[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dexlab"
version = "0.66.1"
description = "UniLab contact dynamics experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["unilab==1.3.3", "unisim-core>=1.7.10,<=1.7.12", "torch==2.9.1"]

[project.optional-dependencies]
libero-inputs = ["h5py==3.16.0"]
cutting-render = ["vtk>=9.4", "Pillow>=10"]
cutting = ["numpy>=1.26", "scipy>=1.12", "numba>=0.61", "matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.entry-points."unilab.tasks"]
dexlab = "dexlab.tasks"

[project.scripts]
dexlab-grasp = "dexlab.tasks.apple_stem:main"

[tool.setuptools]
packages = ["dexlab", "dexlab.tasks"]
py-modules = ["apple_scene", "grasp_display", "mujoco_grasp", "mujoco_model", "physics_utils", "plan_wuji_pinch", "render_stem_focus", "render_wuji_two_views", "robot", "stem_trajectory", "superdex_evidence", "verify_sdf_grasp", "verify_wuji_sequence", "wuji_regrasp", "wuji_stem_grasp"]

[tool.setuptools.package-dir]
"" = "demos/apple-stem-grasp/src"
"dexlab" = "src/dexlab"
