<!doctype html>
<html lang="{{ 'zh-CN' if homepage_is_chinese else 'en' }}" data-content_root="{{ content_root }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ 'DexLab：项目介绍、Sim-to-Real Gap、真机验证边界、物理保证、代表性实验与 Solver 边界。' if homepage_is_chinese else 'DexLab: project overview, Sim-to-Real Gap, hardware-validation boundary, physical checks, representative experiments and solver boundaries.' }}">
  <title>DexLab · {{ '研究总览' if homepage_is_chinese else 'Research overview' }}</title>
  <link rel="stylesheet" href="{{ pathto('_static/research-home.css', 1) }}">
  <link rel="stylesheet" href="{{ pathto('_static/concept-atlas.css', 1) }}">
  <link rel="stylesheet" href="{{ pathto('_static/site-chrome.css', 1) }}">
  <script src="{{ pathto('_static/documentation_options.js', 1) }}"></script>
  <script src="{{ pathto('_static/doctools.js', 1) }}"></script>
  <script src="{{ pathto('_static/sphinx_highlight.js', 1) }}"></script>
  {% if homepage_is_chinese %}
  <script src="{{ pathto('_static/translations.js', 1) }}"></script>
  {% endif %}
  {% include "site-search-assets.html" %}
  <script src="{{ pathto('_static/concept-atlas.js', 1) }}" defer></script>
  <script src="{{ pathto('_static/research-home.js', 1) }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">{{ '跳到正文' if homepage_is_chinese else 'Skip to content' }}</a>
  <div class="page-progress" aria-hidden="true"><span></span></div>
  {% include "site-header.html" %}
  <main id="main-content" role="main">{{ body }}</main>
  {% include "site-footer.html" %}
  {{ concept_dialog_html|safe }}
</body>
</html>
